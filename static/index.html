<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense – Inventory Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e' },
            dark: { 800:'#1e293b',900:'#0f172a',950:'#020617' }
          },
          animation: {
            'fade-in': 'fadeIn 0.4s ease-out',
            'slide-up': 'slideUp 0.5s ease-out',
            'pulse-soft': 'pulseSoft 2s infinite',
            'float': 'float 3s ease-in-out infinite'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { opacity: 0, transform: 'translateY(20px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
            pulseSoft: { '0%,100%': { opacity: 1 }, '50%': { opacity: 0.7 } },
            float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .card-hover { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(14,165,233,0.25); }
    .sidebar-item { transition: all 0.2s; }
    .sidebar-item:hover, .sidebar-item.active { background: linear-gradient(90deg, rgba(14,165,233,0.15), transparent); border-left: 3px solid #0ea5e9; color: #e2e8f0; }
    .kpi-card { position: relative; overflow: hidden; }
    .kpi-card::before { content:''; position:absolute; top:-50%; right:-50%; width:100%; height:100%; background:radial-gradient(circle, rgba(14,165,233,0.15) 0%, transparent 70%); transition: all 0.5s; }
    .kpi-card:hover::before { top:-20%; right:-20%; }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); transition: all 0.3s; }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(14,165,233,0.4); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .status-draft { background: #64748b; }
    .status-waiting { background: #f59e0b; }
    .status-ready { background: #3b82f6; }
    .status-done { background: #10b981; }
    .status-canceled { background: #ef4444; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 2px rgba(14,165,233,0.4); }
    .table-row { transition: background 0.15s; }
    .table-row:hover { background: rgba(14,165,233,0.08); }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen">
  <div id="toasts" class="fixed top-4 right-4 z-[100] space-y-2"></div>

  <!-- AUTH -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-dark-950 via-dark-900 to-brand-900/30">
    <div class="w-full max-w-md animate-slide-up">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 shadow-lg shadow-brand-500/30 mb-4 animate-float">
          <i class="fas fa-boxes-stacked text-2xl text-white"></i>
        </div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-brand-300 to-brand-500 bg-clip-text text-transparent">StockSense</h1>
        <p class="text-slate-400 mt-1">Inventory Management System</p>
      </div>
      <div class="glass rounded-2xl p-8 shadow-2xl">
        <div class="flex mb-6 bg-dark-800 rounded-xl p-1">
          <button onclick="switchAuthTab('login')" id="tab-login" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-brand-600 text-white transition">Login</button>
          <button onclick="switchAuthTab('register')" id="tab-register" class="flex-1 py-2.5 rounded-lg text-sm font-medium text-slate-400 transition">Sign Up</button>
          <button onclick="switchAuthTab('forgot')" id="tab-forgot" class="flex-1 py-2.5 rounded-lg text-sm font-medium text-slate-400 transition">Reset</button>
        </div>
        <form id="form-login" class="space-y-4" onsubmit="handleLogin(event)">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Email</label>
            <input type="email" id="login-email" value="admin@stocksense.com" required class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
            <input type="password" id="login-password" value="admin123" required class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" />
          </div>
          <button type="submit" class="w-full py-3 btn-primary text-white font-semibold rounded-xl">Sign In</button>
          <p class="text-center text-xs text-slate-500 mt-3">Demo: admin@stocksense.com / admin123</p>
        </form>
        <form id="form-register" class="space-y-4 hidden" onsubmit="handleRegister(event)">
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Full Name</label><input type="text" id="reg-name" class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" /></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Username</label><input type="text" id="reg-username" required class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" /></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Email</label><input type="email" id="reg-email" required class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" /></div>
          <div><label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label><input type="password" id="reg-password" required minlength="6" class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" /></div>
          <button type="submit" class="w-full py-3 btn-primary text-white font-semibold rounded-xl">Create Account</button>
        </form>
        <form id="form-forgot" class="space-y-4 hidden" onsubmit="handleForgot(event)">
          <div id="forgot-step1">
            <label class="block text-xs font-medium text-slate-400 mb-1.5">Email</label>
            <input type="email" id="forgot-email" required class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" />
            <button type="submit" class="w-full mt-4 py-3 btn-primary text-white font-semibold rounded-xl">Send OTP</button>
          </div>
          <div id="forgot-step2" class="hidden space-y-4">
            <p class="text-sm text-brand-400" id="otp-display"></p>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">OTP</label><input type="text" id="forgot-otp" class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" /></div>
            <div><label class="block text-xs font-medium text-slate-400 mb-1.5">New Password</label><input type="password" id="forgot-newpass" minlength="6" class="w-full px-4 py-3 bg-dark-800 border border-slate-700 rounded-xl text-sm" /></div>
            <button type="button" onclick="handleReset()" class="w-full py-3 btn-primary text-white font-semibold rounded-xl">Reset Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app-shell" class="hidden min-h-screen flex">
    <aside class="w-64 bg-dark-900 border-r border-slate-800 flex flex-col fixed h-full z-40">
      <div class="p-5 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center"><i class="fas fa-boxes-stacked text-white"></i></div>
          <div><h2 class="font-bold text-lg">StockSense</h2><p class="text-xs text-slate-500">IMS</p></div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <button onclick="navigate('dashboard')" class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium" data-page="dashboard"><i class="fas fa-chart-pie w-5"></i> Dashboard</button>
        <button onclick="navigate('products')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="products"><i class="fas fa-box w-5"></i> Products</button>
        <p class="px-4 pt-4 pb-1 text-xs font-semibold text-slate-500 uppercase tracking-wider">Operations</p>
        <button onclick="navigate('receipts')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="receipts"><i class="fas fa-truck-loading w-5"></i> Receipts</button>
        <button onclick="navigate('deliveries')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="deliveries"><i class="fas fa-shipping-fast w-5"></i> Deliveries</button>
        <button onclick="navigate('transfers')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="transfers"><i class="fas fa-exchange-alt w-5"></i> Transfers</button>
        <button onclick="navigate('adjustments')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="adjustments"><i class="fas fa-balance-scale w-5"></i> Adjustments</button>
        <button onclick="navigate('moves')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="moves"><i class="fas fa-history w-5"></i> Move History</button>
        <p class="px-4 pt-4 pb-1 text-xs font-semibold text-slate-500 uppercase tracking-wider">Settings</p>
        <button onclick="navigate('warehouses')" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400" data-page="warehouses"><i class="fas fa-warehouse w-5"></i> Warehouses</button>
      </nav>
      <div class="p-4 border-t border-slate-800">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-9 h-9 rounded-full bg-brand-600 flex items-center justify-center text-sm font-bold" id="user-avatar">A</div>
          <div class="flex-1 min-w-0"><p class="text-sm font-medium truncate" id="user-name">Admin</p><p class="text-xs text-slate-500 truncate" id="user-role">Manager</p></div>
        </div>
        <button onclick="logout()" class="w-full flex items-center justify-center gap-2 py-2.5 text-sm text-slate-400 hover:text-red-400 transition rounded-lg hover:bg-red-500/10"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>
    <main class="flex-1 ml-64 min-h-screen">
      <header class="sticky top-0 z-30 bg-dark-950/80 backdrop-blur-md border-b border-slate-800 px-6 py-4 flex items-center justify-between">
        <div><h1 class="text-xl font-bold" id="page-title">Dashboard</h1><p class="text-xs text-slate-500" id="page-subtitle">Overview of inventory operations</p></div>
        <div class="flex items-center gap-3">
          <div class="relative">
            <input type="text" id="global-search" placeholder="Search SKU or product..." class="pl-10 pr-4 py-2 bg-dark-800 border border-slate-700 rounded-xl text-sm w-64" onkeyup="if(event.key==='Enter') globalSearch()" />
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          </div>
          <button onclick="refreshCurrent()" class="p-2.5 rounded-xl bg-dark-800 border border-slate-700 hover:border-brand-500 transition"><i class="fas fa-sync-alt text-slate-400"></i></button>
        </div>
      </header>
      <div id="page-content" class="p-6 animate-fade-in"></div>
    </main>
  </div>

  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="glass rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl animate-slide-up" id="modal-content"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
